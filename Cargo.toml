[package]
name = "vetis-smol"
version = "0.1.2-beta.3"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis-smol"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server with smol runtime"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "smol", "rest-server"]
publish = true
rust-version = "1.85.0"

[package.metadata.cargo-machete]
ignored = ["peekable"]

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http2",
  "http3",
  "rust-tls"
]

rust-tls = ["futures-rustls", "rustls", "rustls-provider"]

rustls-provider = ["__rustls_awc_lc_rs"]
__rustls_awc_lc_rs = ["futures-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["futures-rustls/ring", "quinn/rustls-ring"]

http2 = [
  "hyper/http2",
  "hyper/server",
  "hyper-util/server",
  "hyper-util/http2",
]
http3 = [
  "dep:h3",
  "dep:h3-quinn",
  "hyper/server",
  "hyper-util/server",
  "hyper-body-utils/h3",
  "quinn/runtime-smol",
]

[dependencies]
bytes = "1.12.1"
crossfire = { version = "3.1.20", features = ["async_std"] }
futures-lite = { version = "2.6.1", default-features = false }
futures-rustls = { version = "0.26.0", optional = true, default-features = false }
futures-util = { version = "0.3.32", features = [ "async-await-macro" ] }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
http = "1.5.0"
http-body-util = { version = "0.1.5" }
hyper = { version = "1.12.0", default-features = false, features = [
  "http1",
  "server",
] }
hyper-body-utils = { version = "0.1.18", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = [
  "server",
  "http1",
] }
log = "0.4.34"
papaya = "0.2.5"
#peekable = { version = "0.6.2", features = ["future"] }
quinn = { version = "0.11.11", optional = true, default-features = false }
rand = { version = "0.10.3", default-features = false }
rustls = { version = "0.23.46", optional = true, default-features = false }
see = "0.1.2"
smol = { version = "2.0.2", default-features = false }
smol-hyper = { version = "0.1.1", default-features = false }
smol-macros = { version = "0.1.1", default-features = false }
vetis = { version = "0.1.7-beta.6", default-features = false }

[dev-dependencies]
deboa = { version = "0.1.5-beta.5" }
deboa-smol = { version = "0.1.4-beta.2", default-features = false, features = [
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
macro_rules_attribute = { version = "0.2.2", default-features = false }
smol = { version = "2.0.2", default-features = false }
smol-hyper = { version = "0.1.1", default-features = false }
smol-macros = { version = "0.1.1", default-features = false }
